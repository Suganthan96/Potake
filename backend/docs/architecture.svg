<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Potake architecture</text>
  <text x="600" y="62" text-anchor="middle" font-size="14" fill="#475569">Staking bridge and policy agent on Portaldot V3 testnet</text>

  <!-- Chain container -->
  <rect x="40" y="90" width="1120" height="290" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="116" font-size="15" font-weight="700" fill="#0f172a">Portaldot V3 testnet (chain ID 420420777)</text>

  <!-- Substrate side -->
  <rect x="64" y="135" width="500" height="225" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="84" y="160" font-size="14" font-weight="700" fill="#3730a3">Substrate side</text>
  <rect x="84" y="176" width="220" height="56" rx="6" fill="#fff" stroke="#6366f1"/>
  <text x="194" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">Staking pallet</text>
  <text x="194" y="219" text-anchor="middle" font-size="12" fill="#475569">validators, stake, nominate</text>
  <rect x="324" y="176" width="220" height="56" rx="6" fill="#fff" stroke="#6366f1"/>
  <text x="434" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">Session / era events</text>
  <text x="434" y="219" text-anchor="middle" font-size="12" fill="#475569">StakersElected, EraPaid</text>
  <rect x="84" y="250" width="220" height="56" rx="6" fill="#fff" stroke="#6366f1"/>
  <text x="194" y="274" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">ImOnline + Offences</text>
  <text x="194" y="293" text-anchor="middle" font-size="12" fill="#475569">uptime signals</text>
  <rect x="324" y="250" width="220" height="56" rx="6" fill="#fff" stroke="#a5b4fc" stroke-dasharray="5 4"/>
  <text x="434" y="274" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">Nomination pools</text>
  <text x="434" y="293" text-anchor="middle" font-size="12" fill="#475569">unverified on V3</text>
  <text x="84" y="340" font-size="12" fill="#475569">Endpoint: wss://test-node-v3.portaldot.dev</text>

  <!-- EVM side -->
  <rect x="636" y="135" width="500" height="225" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="656" y="160" font-size="14" font-weight="700" fill="#065f46">EVM side (Revive)</text>
  <rect x="656" y="176" width="220" height="56" rx="6" fill="#fff" stroke="#10b981"/>
  <text x="766" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">StakingOracle.sol</text>
  <text x="766" y="219" text-anchor="middle" font-size="12" fill="#475569">per-era snapshots</text>
  <rect x="896" y="176" width="220" height="56" rx="6" fill="#fff" stroke="#10b981"/>
  <text x="1006" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">PolicyRegistry.sol</text>
  <text x="1006" y="219" text-anchor="middle" font-size="12" fill="#475569">rules + action log</text>
  <rect x="656" y="250" width="460" height="56" rx="6" fill="#fff" stroke="#10b981" stroke-dasharray="5 4"/>
  <text x="886" y="274" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">GatedVault.sol (demo consumer)</text>
  <text x="886" y="293" text-anchor="middle" font-size="12" fill="#475569">reads the oracle before allowing an action</text>
  <text x="656" y="340" font-size="12" fill="#475569">Endpoint: https://test-evm-rpc-v3.portaldot.dev</text>

  <!-- Off-chain -->
  <rect x="40" y="440" width="1120" height="190" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="60" y="624" font-size="13" font-weight="700" fill="#9a3412">Off-chain (Node.js / TypeScript, polkadot-js + ethers)</text>
  <rect x="64" y="486" width="320" height="120" rx="8" fill="#fff" stroke="#f97316"/>
  <text x="224" y="510" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Relayer</text>
  <text x="224" y="534" text-anchor="middle" font-size="12" fill="#475569">1. detect era change</text>
  <text x="224" y="552" text-anchor="middle" font-size="12" fill="#475569">2. read validators, stake, rewards</text>
  <text x="224" y="570" text-anchor="middle" font-size="12" fill="#475569">3. derive uptime from ImOnline</text>
  <text x="224" y="588" text-anchor="middle" font-size="12" fill="#475569">4. publish snapshot to oracle</text>
  <rect x="440" y="486" width="400" height="120" rx="8" fill="#fff" stroke="#f97316"/>
  <text x="640" y="510" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Policy agent</text>
  <text x="640" y="534" text-anchor="middle" font-size="12" fill="#475569">1. read policy from registry</text>
  <text x="640" y="552" text-anchor="middle" font-size="12" fill="#475569">2. compare account's nominations to rules</text>
  <text x="640" y="570" text-anchor="middle" font-size="12" fill="#475569">3. if violated: submit staking.nominate</text>
  <text x="640" y="588" text-anchor="middle" font-size="12" fill="#475569">4. log era, rule, extrinsic hash to registry</text>
  <rect x="896" y="486" width="240" height="120" rx="8" fill="#fff" stroke="#f97316"/>
  <text x="1016" y="510" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">CLI + Dashboard</text>
  <text x="1016" y="534" text-anchor="middle" font-size="12" fill="#475569">potake status | relay | agent</text>
  <text x="1016" y="552" text-anchor="middle" font-size="12" fill="#475569">read-only dashboard shows</text>
  <text x="1016" y="570" text-anchor="middle" font-size="12" fill="#475569">snapshots, compliance,</text>
  <text x="1016" y="588" text-anchor="middle" font-size="12" fill="#475569">action log, explorer links</text>

  <!-- Arrows -->
  <!-- Relayer reads Substrate state -->
  <path d="M150 486 L150 362" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="158" y="425" font-size="11" fill="#334155">read state</text>
  <!-- Relayer publishes snapshot to oracle -->
  <path d="M330 486 L330 400 L766 400 L766 362" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="560" y="393" font-size="11" fill="#334155">publish snapshot (EVM tx)</text>
  <!-- Agent submits nominate -->
  <path d="M480 486 L480 362" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="488" y="424" font-size="11" fill="#334155">nominate (extrinsic)</text>
  <!-- Agent <-> registry -->
  <path d="M700 486 L700 435 L1006 435 L1006 362" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="780" y="428" font-size="11" fill="#334155">read policy / log action</text>
  <!-- Dashboard reads -->
  <path d="M1066 486 L1066 465 L1100 465 L1100 362" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)" stroke-dasharray="4 3"/>
  <text x="1108" y="425" font-size="11" fill="#334155">read</text>
  <!-- Oracle -> vault -->
  <path d="M766 232 L766 250" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- Legend -->
  <rect x="40" y="660" width="1120" height="80" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="686" font-size="13" font-weight="700" fill="#0f172a">Trust and limits</text>
  <text x="60" y="708" font-size="12" fill="#334155">Relayer and agent are trusted. PolicyRegistry is an audit trail, not enforcement. Dashed boxes: optional or unverified on V3.</text>
  <text x="60" y="728" font-size="12" fill="#334155">On-chain evidence: contract addresses, snapshot txs, nominate extrinsic hashes, action log entries.</text>
</svg>
